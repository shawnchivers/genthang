<text x="45" y="782" class="sub" >Optional100nF ceramic: directly between DB9.5 (3.3V) and DB9.8 (GND).</text>
<text x="45" y="824" class="sub" >Six data inputs use FPGA internal pull-ups. TH/select is an FPGA OUTPUT.</text>
<text x="45" y="852" class="sub" >Player2 stays unwired. These player1 GPIOs avoid onboard LEDs and HDMI sideband pins.</text>
<text x="45" y="890" class="sub" >Minimum parts: Nano + passive male DB9 breakout + nine jumpers. No RS-232/USB-serial adapter.</text>
<text x="45" y="919" class="sub" >Not all Sega pads work at3.3V. Check pad current and Nano3.3V headroom. No hot-plug protection.</text>
<text x="45" y="948" class="small" >Nano orientation/header mapping: Sipeed v3921 schematic. Confirm the actual module revision.</text>
<text x="45" y="974" class="small" >Wire colours are illustration choices, NOT Sega cable colour codes. Drawing not to mechanical scale.</text>
<text x="45" y="1005" class="small" >See the Gen Thang README for matched-bitstream requirements and power-off connection procedure.</text>
</svg>
