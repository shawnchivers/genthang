<text x="30" y="68" class="sub">3.3V ONLY · No external resistors/ICs · db9_breadboard bitstream required</text>
<text x="30" y="94" class="sub" style="fill:#aa2424">Unprotected bench test. USB OFF before connecting. Never connect5V or externally powered pads.</text>
